<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="botBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#1B4ED8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="botNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="glowEffect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E40AF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Hexagon/Card -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="url(#botBgGrad)" filter="url(#subtleShadow)"/>
  
  <!-- Subtle Grid Accent -->
  <circle cx="60" cy="60" r="42" stroke="url(#glowEffect)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Multisender Branching / Distribution Network Lines -->
  <!-- Center Source Node -->
  <circle cx="36" cy="60" r="9" fill="url(#botNodeGrad)"/>
  
  <!-- Network Paths branching to 3 Destination Nodes -->
  <path d="M43 56L78 38" stroke="#93C5FD" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M45 60H80" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M43 64L78 82" stroke="#93C5FD" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Destination Target Nodes -->
  <circle cx="84" cy="36" r="7.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="86" cy="60" r="7.5" fill="#60A5FA" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="84" cy="84" r="7.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- Center Core Pulsing Dot -->
  <circle cx="36" cy="60" r="4" fill="#1B4ED8"/>
</svg>
